# ============================================
# CI Pipeline — Loom Multiverse
# ============================================
# Runs on every push and PR. Uses matrix strategy for Node.js versions,
# Turborepo caching, and posts test results as PR comments.

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ──────────────────────────────────────────
  # Lint & Format Check
  # ──────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: pnpm turbo run lint

      - name: Check formatting
        run: pnpm format:check

  # ──────────────────────────────────────────
  # Type Check
  # ──────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run TypeScript compiler
        run: pnpm turbo run typecheck

  # ──────────────────────────────────────────
  # Unit & Integration Tests (Matrix)
  # ──────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom_secret
          POSTGRES_DB: loom_multiverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        env:
          DATABASE_URL: postgresql://loom:loom_secret@localhost:5432/loom_multiverse_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm turbo run test

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage/"
          retention-days: 7

  # ──────────────────────────────────────────
  # Build Verification
  # ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build all packages
        run: pnpm turbo run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: "**/dist/"
          retention-days: 1

  # ──────────────────────────────────────────
  # Post Results to PR
  # ──────────────────────────────────────────
  report:
    name: PR Report
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            const results = checks.check_runs
              .filter(c => c.name !== 'PR Report')
              .map(c => `| ${c.name} | ${c.conclusion === 'success' ? '✅' : '❌'} ${c.conclusion || 'pending'} |`)
              .join('\n');

            const body = `## CI Results\n\n| Check | Status |\n|-------|--------|\n${results}\n\n*Auto-generated by CI pipeline*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ──────────────────────────────────────────
  # Sync Linear Issues
  # ──────────────────────────────────────────
  linear-sync:
    name: Linear Sync
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Sync Linear issues to "In Review"
        uses: ./.github/actions/linear-sync
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          target-status: "In Review"
