# ============================================
# Reusable Deploy Workflow
# ============================================
# Called by deploy-staging.yml and deploy-production.yml.
# Handles building, deploying API + Dashboard, and health checks.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (staging | production)"
      api-url:
        required: true
        type: string
        description: "API URL for health checks"
    secrets:
      RENDER_API_KEY:
        required: true
      VERCEL_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: false
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build all packages
        run: pnpm turbo run build

      - name: Deploy API to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Deploying API to ${{ inputs.environment }}..."
          curl -s -X POST "https://api.render.com/v1/services/srv-xxxxx/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}'

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.api-url }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

  deploy-dashboard:
    name: Deploy Dashboard (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=${{ inputs.environment == 'production' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build dashboard
        run: |
          vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  update-linear:
    name: Update Linear Status
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-dashboard]
    if: always() && needs.deploy-api.result == 'success' && needs.deploy-dashboard.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Sync to Linear
        uses: ./.github/actions/linear-sync
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          target-status: ${{ inputs.environment == 'production' && 'Deployed' || 'In Review' }}
