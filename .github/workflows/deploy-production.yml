# ============================================
# Deploy to Production
# ============================================
# Triggered on push to main (after PR merge).
# Requires environment protection rules (manual approval).
# Creates GitHub Release and syncs to Linear.

name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  # ──────────────────────────────────────────
  # Pre-deploy: Full regression suite
  # ──────────────────────────────────────────
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom_secret
          POSTGRES_DB: loom_multiverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql://loom:loom_secret@localhost:5432/loom_multiverse_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm turbo run test

  # ──────────────────────────────────────────
  # Deploy (requires manual approval)
  # ──────────────────────────────────────────
  deploy:
    needs: regression
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api-url: https://api.loom-multiverse.dev
    secrets: inherit

  # ──────────────────────────────────────────
  # Create Release + Changelog
  # ──────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$LAST_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -20)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${new Date().toISOString().split('T')[0].replace(/-/g, '.')}.${context.runNumber}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `## What's Changed\n\n${{ steps.changelog.outputs.changes }}\n\n**Full Changelog:** https://github.com/${context.repo.owner}/${context.repo.repo}/compare/...${tag}`,
              generate_release_notes: true,
            });

      - name: Sync release to Linear
        if: secrets.LINEAR_API_KEY != ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_API_KEY }}
          command: sync
