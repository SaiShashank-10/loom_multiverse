version: '3.8'

services:
  db:
    image: postgres:14
    container_name: techaccessory_db
    environment:
      POSTGRES_DB: techaccessory
      POSTGRES_USER: techuser
      POSTGRES_PASSWORD: techpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techaccessory_backend
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: techuser
      DB_PASSWORD: techpassword
      DB_NAME: techaccessory
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  db_data: