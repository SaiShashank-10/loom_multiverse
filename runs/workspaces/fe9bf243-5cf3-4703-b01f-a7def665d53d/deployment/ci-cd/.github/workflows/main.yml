name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14.x'

      - name: Install dependencies
        run: npm install --only=production

      - name: Run tests
        run: npm test

  build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14.x'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Deploy to staging
        run: |
          docker-compose -f deployment/docker-compose.staging.yml up --build -d

      - name: Run staging tests
        run: |
          docker-compose -f deployment/docker-compose.staging.yml exec web npm test

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: |
          docker-compose -f deployment/docker-compose.production.yml up --build -d