apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-service-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: route-service
  template:
    metadata:
      labels:
        app: route-service
    spec:
      containers:
        - name: route-service
          image: roadtripplanner/route-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: uri
            - name: NODE_ENV
              value: production

---

